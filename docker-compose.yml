services:
  db:
    image: postgres:16-alpine
    container_name: primaweb_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-primaweb_db}
      POSTGRES_USER: ${POSTGRES_USER:-primaweb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-primaweb_secret_password}
    ports:
      - "${HOST_PORT_DB:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primaweb_user} -d ${POSTGRES_DB:-primaweb_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - primaweb_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primaweb_backend
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "${HOST_PORT_BACKEND:-8002}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - primaweb_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: primaweb_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${HOST_PORT_FRONTEND:-3001}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8002/api}
    depends_on:
      - backend
    networks:
      - primaweb_net

  nginx:
    image: nginx:1.25-alpine
    container_name: primaweb_nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT_NGINX:-8085}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_media:/var/www/media:ro
      - backend_static:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - primaweb_net

volumes:
  postgres_data:
  backend_media:
  backend_static:

networks:
  primaweb_net:
    driver: bridge
